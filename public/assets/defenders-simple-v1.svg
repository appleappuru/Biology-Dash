<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 384" width="512" height="384">
  <defs>
    <!-- Neutrophil Gradients -->
    <radialGradient id="neutroGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f0fbff"/>
      <stop offset="100%" stop-color="#d4f5fc"/>
    </radialGradient>

    <!-- Macrophage Gradients -->
    <radialGradient id="macroGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e8fcf7"/>
      <stop offset="65%" stop-color="#bbf2e5"/>
      <stop offset="100%" stop-color="#7fe5cf"/>
    </radialGradient>
    <radialGradient id="macroBelly" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff9e6" stop-opacity="0.4"/>
    </radialGradient>

    <!-- Plasma Cell Gradients -->
    <radialGradient id="plasmaGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fdf8ff"/>
      <stop offset="65%" stop-color="#e4d2fc"/>
      <stop offset="100%" stop-color="#cbb5f7"/>
    </radialGradient>

    <!-- Eyes & Specular -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================= ROW 0: NEUTROPHIL (Y: 0..128) ================= -->
  <!-- Col 0: Forward Idle -->
  <g transform="translate(64, 64)">
    <circle cx="0" cy="0" r="42" fill="url(#neutroGrad)" stroke="#b2ebf2" stroke-width="2.5"/>
    <!-- Cheeks -->
    <ellipse cx="-22" cy="10" rx="7" ry="4.5" fill="#ffb4a2" opacity="0.85"/>
    <ellipse cx="22" cy="10" rx="7" ry="4.5" fill="#ffb4a2" opacity="0.85"/>
    <!-- Eyes -->
    <circle cx="-14" cy="-2" r="5" fill="#0f172a"/>
    <circle cx="-15.5" cy="-3.5" r="1.8" fill="#ffffff"/>
    <circle cx="-12" cy="0" r="0.9" fill="#ffffff"/>
    <circle cx="14" cy="-2" r="5" fill="#0f172a"/>
    <circle cx="12.5" cy="-3.5" r="1.8" fill="#ffffff"/>
    <circle cx="16" cy="0" r="0.9" fill="#ffffff"/>
    <!-- Smile -->
    <path d="M -6 8 Q 0 14 6 8" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Col 1: Bank Left -->
  <g transform="translate(192, 64) rotate(-8)">
    <ellipse cx="0" cy="0" rx="44" ry="39" fill="url(#neutroGrad)" stroke="#b2ebf2" stroke-width="2.5"/>
    <ellipse cx="-20" cy="9" rx="6" ry="4" fill="#ffb4a2" opacity="0.85"/>
    <ellipse cx="20" cy="9" rx="6" ry="4" fill="#ffb4a2" opacity="0.85"/>
    <circle cx="-13" cy="-3" r="5" fill="#0f172a"/>
    <circle cx="-14.5" cy="-4.5" r="1.8" fill="#ffffff"/>
    <path d="M 8 -2 Q 13 -6 18 -2" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M -5 7 Q 0 12 5 7" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Col 2: Bank Right -->
  <g transform="translate(320, 64) rotate(8)">
    <ellipse cx="0" cy="0" rx="44" ry="39" fill="url(#neutroGrad)" stroke="#b2ebf2" stroke-width="2.5"/>
    <ellipse cx="-20" cy="9" rx="6" ry="4" fill="#ffb4a2" opacity="0.85"/>
    <ellipse cx="20" cy="9" rx="6" ry="4" fill="#ffb4a2" opacity="0.85"/>
    <path d="M -18 -2 Q -13 -6 -8 -2" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="13" cy="-3" r="5" fill="#0f172a"/>
    <circle cx="11.5" cy="-4.5" r="1.8" fill="#ffffff"/>
    <path d="M -5 7 Q 0 12 5 7" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Col 3: Cozy Hug / Engulf -->
  <g transform="translate(448, 64)">
    <circle cx="0" cy="0" r="44" fill="url(#neutroGrad)" stroke="#b2ebf2" stroke-width="2.5"/>
    <!-- Hug Arms -->
    <path d="M -34 6 C -46 -6, -42 -22, -26 -16 C -18 -12, -22 2, -28 12" fill="#f0fbff" stroke="#b2ebf2" stroke-width="2"/>
    <path d="M 34 6 C 46 -6, 42 -22, 26 -16 C 18 -12, 22 2, 28 12" fill="#f0fbff" stroke="#b2ebf2" stroke-width="2"/>
    <ellipse cx="-20" cy="11" rx="7" ry="5" fill="#ff7675" opacity="0.9"/>
    <ellipse cx="20" cy="11" rx="7" ry="5" fill="#ff7675" opacity="0.9"/>
    <!-- Joyful Eyes ^ ^ -->
    <path d="M -18 0 Q -12 -8 -6 0" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 6 0 Q 12 -8 18 0" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M -7 9 Q 0 18 7 9" stroke="#0f172a" stroke-width="2.5" fill="#ff7675" stroke-linecap="round"/>
    <!-- Little Sparkle -->
    <path d="M 0 -26 L 3 -19 L 10 -16 L 3 -13 L 0 -6 L -3 -13 L -10 -16 L -3 -19 Z" fill="#ffeaa7"/>
  </g>

  <!-- ================= ROW 1: MACROPHAGE (Y: 128..256) ================= -->
  <!-- Col 0: Forward Idle -->
  <g transform="translate(64, 192)">
    <!-- Big Hugger Arms -->
    <ellipse cx="-38" cy="4" rx="14" ry="10" fill="#bbf2e5" stroke="#48d1b1" stroke-width="2.5"/>
    <ellipse cx="38" cy="4" rx="14" ry="10" fill="#bbf2e5" stroke="#48d1b1" stroke-width="2.5"/>
    <!-- Chubby Body -->
    <ellipse cx="0" cy="0" rx="46" ry="42" fill="url(#macroGrad)" stroke="#48d1b1" stroke-width="2.5"/>
    <ellipse cx="0" cy="8" rx="28" ry="22" fill="url(#macroBelly)"/>
    <ellipse cx="-24" cy="6" rx="8" ry="5" fill="#ffb4a2" opacity="0.85"/>
    <ellipse cx="24" cy="6" rx="8" ry="5" fill="#ffb4a2" opacity="0.85"/>
    <circle cx="-16" cy="-4" r="5.5" fill="#0f172a"/>
    <circle cx="-17.5" cy="-5.5" r="2" fill="#ffffff"/>
    <circle cx="16" cy="-4" r="5.5" fill="#0f172a"/>
    <circle cx="14.5" cy="-5.5" r="2" fill="#ffffff"/>
    <path d="M -8 8 Q 0 16 8 8" stroke="#0f172a" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Col 1: Bank Left -->
  <g transform="translate(192, 192) rotate(-8)">
    <ellipse cx="-36" cy="2" rx="14" ry="10" fill="#bbf2e5" stroke="#48d1b1" stroke-width="2"/>
    <ellipse cx="36" cy="6" rx="14" ry="10" fill="#bbf2e5" stroke="#48d1b1" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="46" ry="40" fill="url(#macroGrad)" stroke="#48d1b1" stroke-width="2.5"/>
    <ellipse cx="-2" cy="7" rx="27" ry="20" fill="url(#macroBelly)"/>
    <ellipse cx="-22" cy="5" rx="7" ry="4.5" fill="#ffb4a2" opacity="0.85"/>
    <ellipse cx="22" cy="5" rx="7" ry="4.5" fill="#ffb4a2" opacity="0.85"/>
    <circle cx="-15" cy="-4" r="5.5" fill="#0f172a"/>
    <circle cx="-16.5" cy="-5.5" r="2" fill="#ffffff"/>
    <path d="M 10 -4 Q 16 -8 22 -4" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M -7 7 Q 0 14 7 7" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Col 2: Bank Right -->
  <g transform="translate(320, 192) rotate(8)">
    <ellipse cx="-36" cy="6" rx="14" ry="10" fill="#bbf2e5" stroke="#48d1b1" stroke-width="2"/>
    <ellipse cx="36" cy="2" rx="14" ry="10" fill="#bbf2e5" stroke="#48d1b1" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="46" ry="40" fill="url(#macroGrad)" stroke="#48d1b1" stroke-width="2.5"/>
    <ellipse cx="2" cy="7" rx="27" ry="20" fill="url(#macroBelly)"/>
    <ellipse cx="-22" cy="5" rx="7" ry="4.5" fill="#ffb4a2" opacity="0.85"/>
    <ellipse cx="22" cy="5" rx="7" ry="4.5" fill="#ffb4a2" opacity="0.85"/>
    <path d="M -22 -4 Q -16 -8 -10 -4" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="15" cy="-4" r="5.5" fill="#0f172a"/>
    <circle cx="13.5" cy="-5.5" r="2" fill="#ffffff"/>
    <path d="M -7 7 Q 0 14 7 7" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Col 3: Giant Hug Pose -->
  <g transform="translate(448, 192)">
    <ellipse cx="0" cy="0" rx="48" ry="44" fill="url(#macroGrad)" stroke="#48d1b1" stroke-width="2.5"/>
    <ellipse cx="0" cy="8" rx="30" ry="24" fill="url(#macroBelly)"/>
    <!-- Big Hug Wrap Arms -->
    <path d="M -40 12 C -52 -10, -38 -32, -18 -26 C -6 -20, -14 0, -22 18" fill="#bbf2e5" stroke="#48d1b1" stroke-width="3"/>
    <path d="M 40 12 C 52 -10, 38 -32, 18 -26 C 6 -20, 14 0, 22 18" fill="#bbf2e5" stroke="#48d1b1" stroke-width="3"/>
    <ellipse cx="-24" cy="7" rx="8" ry="5.5" fill="#ff7675" opacity="0.9"/>
    <ellipse cx="24" cy="7" rx="8" ry="5.5" fill="#ff7675" opacity="0.9"/>
    <path d="M -20 -3 Q -14 -11 -8 -3" stroke="#0f172a" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M 8 -3 Q 14 -11 20 -3" stroke="#0f172a" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M -9 8 Q 0 20 9 8" stroke="#0f172a" stroke-width="2.8" fill="#ff7675" stroke-linecap="round"/>
  </g>

  <!-- ================= ROW 2: PLASMA CELL (Y: 256..384) ================= -->
  <!-- Col 0: Forward Idle -->
  <g transform="translate(64, 320)">
    <!-- Halo Ring -->
    <ellipse cx="0" cy="-38" rx="22" ry="7" fill="none" stroke="#ffeaa7" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="40" fill="url(#plasmaGrad)" stroke="#a29bfe" stroke-width="2.5"/>
    <ellipse cx="-20" cy="9" rx="6.5" ry="4" fill="#ffb4a2" opacity="0.85"/>
    <ellipse cx="20" cy="9" rx="6.5" ry="4" fill="#ffb4a2" opacity="0.85"/>
    <circle cx="-13" cy="-2" r="5" fill="#0f172a"/>
    <circle cx="-14.5" cy="-3.5" r="1.8" fill="#ffffff"/>
    <circle cx="13" cy="-2" r="5" fill="#0f172a"/>
    <circle cx="11.5" cy="-3.5" r="1.8" fill="#ffffff"/>
    <path d="M -6 8 Q 0 13 6 8" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Col 1: Bank Left -->
  <g transform="translate(192, 320) rotate(-8)">
    <ellipse cx="-2" cy="-38" rx="22" ry="7" fill="none" stroke="#ffeaa7" stroke-width="2.5" filter="url(#glow)"/>
    <ellipse cx="0" cy="0" rx="42" ry="38" fill="url(#plasmaGrad)" stroke="#a29bfe" stroke-width="2.5"/>
    <ellipse cx="-19" cy="8" rx="6" ry="4" fill="#ffb4a2" opacity="0.85"/>
    <ellipse cx="19" cy="8" rx="6" ry="4" fill="#ffb4a2" opacity="0.85"/>
    <circle cx="-12" cy="-3" r="5" fill="#0f172a"/>
    <circle cx="-13.5" cy="-4.5" r="1.8" fill="#ffffff"/>
    <path d="M 8 -3 Q 13 -7 18 -3" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M -5 7 Q 0 12 5 7" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Col 2: Bank Right -->
  <g transform="translate(320, 320) rotate(8)">
    <ellipse cx="2" cy="-38" rx="22" ry="7" fill="none" stroke="#ffeaa7" stroke-width="2.5" filter="url(#glow)"/>
    <ellipse cx="0" cy="0" rx="42" ry="38" fill="url(#plasmaGrad)" stroke="#a29bfe" stroke-width="2.5"/>
    <ellipse cx="-19" cy="8" rx="6" ry="4" fill="#ffb4a2" opacity="0.85"/>
    <ellipse cx="19" cy="8" rx="6" ry="4" fill="#ffb4a2" opacity="0.85"/>
    <path d="M -18 -3 Q -13 -7 -8 -3" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="12" cy="-3" r="5" fill="#0f172a"/>
    <circle cx="10.5" cy="-4.5" r="1.8" fill="#ffffff"/>
    <path d="M -5 7 Q 0 12 5 7" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Col 3: Fairy Barrage Pose -->
  <g transform="translate(448, 320)">
    <ellipse cx="0" cy="-40" rx="24" ry="8" fill="none" stroke="#ffeaa7" stroke-width="3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="42" fill="url(#plasmaGrad)" stroke="#a29bfe" stroke-width="2.5"/>
    <!-- Floating Y-Antibodies -->
    <path d="M -36 -18 L -32 -10 M -28 -18 L -32 -10 L -32 -2" stroke="#ffeaa7" stroke-width="3" stroke-linecap="round"/>
    <path d="M 28 -18 L 32 -10 M 36 -18 L 32 -10 L 32 -2" stroke="#ffeaa7" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-20" cy="9" rx="7" ry="4.5" fill="#ff7675" opacity="0.9"/>
    <ellipse cx="20" cy="9" rx="7" ry="4.5" fill="#ff7675" opacity="0.9"/>
    <path d="M -18 -2 Q -12 -9 -6 -2" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 6 -2 Q 12 -9 18 -2" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M -6 8 Q 0 15 6 8" stroke="#0f172a" stroke-width="2.5" fill="#ff7675" stroke-linecap="round"/>
  </g>
</svg>
