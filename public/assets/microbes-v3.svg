<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 288" width="288" height="288">
  <defs>
    <!-- Jelly Gradients -->
    <radialGradient id="goldJelly" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff9db"/>
      <stop offset="60%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#fdcb6e"/>
    </radialGradient>
    <radialGradient id="amberJelly" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe8cc"/>
      <stop offset="60%" stop-color="#ffa94d"/>
      <stop offset="100%" stop-color="#d9480f"/>
    </radialGradient>
    <radialGradient id="peachJelly" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe3e3"/>
      <stop offset="60%" stop-color="#ff8787"/>
      <stop offset="100%" stop-color="#e03131"/>
    </radialGradient>
    <radialGradient id="violetJelly" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f3d9fa"/>
      <stop offset="60%" stop-color="#cc5de8"/>
      <stop offset="100%" stop-color="#862e9c"/>
    </radialGradient>
    <radialGradient id="mintJelly" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c3fae8"/>
      <stop offset="60%" stop-color="#38d9a9"/>
      <stop offset="100%" stop-color="#0ca678"/>
    </radialGradient>
    <radialGradient id="lilacBubble" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f8f0fc"/>
      <stop offset="60%" stop-color="#e599f7"/>
      <stop offset="100%" stop-color="#ae3ec9"/>
    </radialGradient>
    <radialGradient id="coralRod" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe3e3"/>
      <stop offset="60%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#c92a2a"/>
    </radialGradient>
    <radialGradient id="aquaSlug" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c5f6fa"/>
      <stop offset="60%" stop-color="#22b8cf"/>
      <stop offset="100%" stop-color="#1098ad"/>
    </radialGradient>
    <radialGradient id="yeastDough" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff9db"/>
      <stop offset="60%" stop-color="#f1f3f5"/>
      <stop offset="100%" stop-color="#ced4da"/>
    </radialGradient>
  </defs>

  <!-- ================= FRAME 0 (0,0): S. aureus ================= -->
  <g id="s_aureus" transform="translate(48, 48)">
    <circle cx="-12" cy="-10" r="16" fill="url(#goldJelly)" stroke="#e59900" stroke-width="1.8"/>
    <circle cx="14" cy="-8" r="15" fill="url(#goldJelly)" stroke="#e59900" stroke-width="1.8"/>
    <circle cx="0" cy="14" r="17" fill="url(#goldJelly)" stroke="#e59900" stroke-width="1.8"/>
    <circle cx="-1" cy="-2" r="18" fill="url(#goldJelly)" stroke="#e59900" stroke-width="2"/>
    <!-- Face -->
    <circle cx="-6" cy="-3" r="3.2" fill="#212529"/>
    <circle cx="-7" cy="-4" r="1.2" fill="#ffffff"/>
    <circle cx="6" cy="-3" r="3.2" fill="#212529"/>
    <circle cx="5" cy="-4" r="1.2" fill="#ffffff"/>
    <ellipse cx="-12" cy="3" rx="4" ry="2.5" fill="#ffa8a8" opacity="0.8"/>
    <ellipse cx="12" cy="3" rx="4" ry="2.5" fill="#ffa8a8" opacity="0.8"/>
    <path d="M -3 3 Q 0 7 3 3" stroke="#212529" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ================= FRAME 1 (96,0): Beta-Lactamase+ ================= -->
  <g id="beta_lactamase_sa" transform="translate(144, 48)">
    <circle cx="-10" cy="-8" r="16" fill="url(#amberJelly)" stroke="#d9480f" stroke-width="1.8"/>
    <circle cx="12" cy="-6" r="15" fill="url(#amberJelly)" stroke="#d9480f" stroke-width="1.8"/>
    <circle cx="0" cy="12" r="17" fill="url(#amberJelly)" stroke="#d9480f" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="18" fill="url(#amberJelly)" stroke="#d9480f" stroke-width="2"/>
    <!-- Brass Collar / Shield -->
    <path d="M -14 14 Q 0 24 14 14 Q 0 18 -14 14" fill="#ffd43b" stroke="#f59f00" stroke-width="2"/>
    <circle cx="-6" cy="-2" r="3.2" fill="#212529"/>
    <circle cx="6" cy="-2" r="3.2" fill="#212529"/>
    <path d="M -3 4 Q 0 8 3 4" stroke="#212529" stroke-width="1.8" fill="none"/>
  </g>

  <!-- ================= FRAME 2 (192,0): Doxy-Resistant ================= -->
  <g id="doxy_resistant_sa" transform="translate(240, 48)">
    <circle cx="-10" cy="-8" r="16" fill="url(#peachJelly)" stroke="#c92a2a" stroke-width="1.8"/>
    <circle cx="12" cy="-6" r="15" fill="url(#peachJelly)" stroke="#c92a2a" stroke-width="1.8"/>
    <circle cx="0" cy="12" r="17" fill="url(#peachJelly)" stroke="#c92a2a" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="18" fill="url(#peachJelly)" stroke="#c92a2a" stroke-width="2"/>
    <!-- Stubborn Squint Face -->
    <path d="M -10 -4 L -3 -2" stroke="#212529" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 10 -4 L 3 -2" stroke="#212529" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -4 5 Q 0 1 4 5" stroke="#212529" stroke-width="2" fill="none"/>
    <ellipse cx="-13" cy="2" rx="4.5" ry="3" fill="#ff6b6b" opacity="0.9"/>
    <ellipse cx="13" cy="2" rx="4.5" ry="3" fill="#ff6b6b" opacity="0.9"/>
  </g>

  <!-- ================= FRAME 3 (0,96): MRSA with Knight Visor ================= -->
  <g id="mrsa" transform="translate(48, 144)">
    <circle cx="-10" cy="-8" r="16" fill="url(#violetJelly)" stroke="#5f3dc4" stroke-width="1.8"/>
    <circle cx="12" cy="-6" r="15" fill="url(#violetJelly)" stroke="#5f3dc4" stroke-width="1.8"/>
    <circle cx="0" cy="12" r="17" fill="url(#violetJelly)" stroke="#5f3dc4" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="19" fill="url(#violetJelly)" stroke="#5f3dc4" stroke-width="2"/>
    <!-- Cute Knight Visor Helmet -->
    <path d="M -16 -6 C -16 -18, 16 -18, 16 -6 C 16 0, -16 0, -16 -6 Z" fill="#868e96" stroke="#495057" stroke-width="2"/>
    <line x1="-10" y1="-8" x2="10" y2="-8" stroke="#343a40" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-5" cy="-8" r="1.5" fill="#ffec99"/>
    <circle cx="5" cy="-8" r="1.5" fill="#ffec99"/>
  </g>

  <!-- ================= FRAME 4 (96,96): Antigen-B with Crown ♛ ================= -->
  <g id="antigen_b_sa" transform="translate(144, 144)">
    <circle cx="-10" cy="-6" r="16" fill="url(#mintJelly)" stroke="#099268" stroke-width="1.8"/>
    <circle cx="12" cy="-4" r="15" fill="url(#mintJelly)" stroke="#099268" stroke-width="1.8"/>
    <circle cx="0" cy="14" r="17" fill="url(#mintJelly)" stroke="#099268" stroke-width="1.8"/>
    <circle cx="0" cy="2" r="18" fill="url(#mintJelly)" stroke="#099268" stroke-width="2"/>
    <!-- Golden Queen Crown ♛ -->
    <path d="M -15 -14 L -11 -26 L 0 -18 L 11 -26 L 15 -14 Z" fill="#fcc419" stroke="#e67700" stroke-width="2"/>
    <circle cx="-11" cy="-26" r="2.5" fill="#f03e3e"/>
    <circle cx="0" cy="-18" r="2.5" fill="#1c7ed6"/>
    <circle cx="11" cy="-26" r="2.5" fill="#f03e3e"/>
    <circle cx="-6" cy="1" r="3.2" fill="#212529"/>
    <circle cx="6" cy="1" r="3.2" fill="#212529"/>
    <path d="M -3 7 Q 0 11 3 7" stroke="#212529" stroke-width="1.8" fill="none"/>
  </g>

  <!-- ================= FRAME 5 (192,96): Pneumococcus in Bubble ================= -->
  <g id="pneumococcus" transform="translate(240, 144)">
    <!-- Iridescent Translucent Sugar Capsule Bubble -->
    <ellipse cx="0" cy="0" rx="34" ry="26" fill="#eebefa" fill-opacity="0.3" stroke="#da77f2" stroke-width="2"/>
    <path d="M -20 -14 Q -10 -22 10 -16" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
    <!-- Paired Lilac Gumdrops -->
    <ellipse cx="-12" cy="0" rx="14" ry="16" fill="url(#lilacBubble)" stroke="#862e9c" stroke-width="1.5"/>
    <ellipse cx="12" cy="0" rx="14" ry="16" fill="url(#lilacBubble)" stroke="#862e9c" stroke-width="1.5"/>
    <!-- Faces -->
    <circle cx="-14" cy="-2" r="2.5" fill="#212529"/>
    <circle cx="-9" cy="-2" r="2.5" fill="#212529"/>
    <circle cx="9" cy="-2" r="2.5" fill="#212529"/>
    <circle cx="14" cy="-2" r="2.5" fill="#212529"/>
    <path d="M -13 4 Q -11.5 7 -10 4" stroke="#212529" stroke-width="1.5" fill="none"/>
    <path d="M 10 4 Q 11.5 7 13 4" stroke="#212529" stroke-width="1.5" fill="none"/>
  </g>

  <!-- ================= FRAME 6 (0,192): E. coli ================= -->
  <g id="e_coli" transform="translate(48, 240)">
    <!-- Wiggling Flagella Tail -->
    <path d="M -26 0 C -36 -12, -42 12, -48 0" stroke="#ff8787" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M -24 -8 C -34 -20, -40 2, -46 -10" stroke="#ff8787" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Chubby Capsule Rod -->
    <rect x="-24" y="-18" width="48" height="36" rx="18" fill="url(#coralRod)" stroke="#c92a2a" stroke-width="2.2"/>
    <circle cx="4" cy="-4" r="3.5" fill="#212529"/>
    <circle cx="3" cy="-5" r="1.2" fill="#ffffff"/>
    <circle cx="16" cy="-4" r="3.5" fill="#212529"/>
    <circle cx="15" cy="-5" r="1.2" fill="#ffffff"/>
    <ellipse cx="1" cy="4" rx="4" ry="2.5" fill="#ffa8a8" opacity="0.85"/>
    <ellipse cx="20" cy="4" rx="4" ry="2.5" fill="#ffa8a8" opacity="0.85"/>
    <path d="M 8 3 Q 10 8 12 3" stroke="#212529" stroke-width="1.8" fill="none"/>
  </g>

  <!-- ================= FRAME 7 (96,192): Pseudomonas ================= -->
  <g id="pseudomonas" transform="translate(144, 240)">
    <!-- Sleek Aqua Sea-Slug Body -->
    <ellipse cx="0" cy="0" rx="30" ry="18" fill="url(#aquaSlug)" stroke="#0c8599" stroke-width="2.2"/>
    <!-- Playful Antenna -->
    <path d="M 18 -12 Q 24 -24 30 -20" stroke="#22b8cf" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="30" cy="-20" r="3.5" fill="#66d9e8"/>
    <!-- Curious Face -->
    <circle cx="10" cy="-2" r="3.5" fill="#212529"/>
    <circle cx="9" cy="-3" r="1.2" fill="#ffffff"/>
    <circle cx="20" cy="-2" r="3.5" fill="#212529"/>
    <circle cx="19" cy="-3" r="1.2" fill="#ffffff"/>
    <ellipse cx="5" cy="5" rx="4" ry="2.5" fill="#66d9e8" opacity="0.85"/>
    <path d="M 13 4 Q 15 9 17 4" stroke="#212529" stroke-width="1.8" fill="none"/>
  </g>

  <!-- ================= FRAME 8 (192,192): Candida ================= -->
  <g id="candida" transform="translate(240, 240)">
    <!-- Main Dumpling Dough-drop -->
    <circle cx="0" cy="4" r="24" fill="url(#yeastDough)" stroke="#868e96" stroke-width="2.2"/>
    <!-- Baby Bud Sprout -->
    <circle cx="14" cy="-16" r="12" fill="url(#yeastDough)" stroke="#868e96" stroke-width="1.8"/>
    <!-- Baby Face -->
    <circle cx="12" cy="-17" r="1.8" fill="#212529"/>
    <circle cx="17" cy="-17" r="1.8" fill="#212529"/>
    <path d="M 13 -13 Q 14.5 -11 16 -13" stroke="#212529" stroke-width="1.2" fill="none"/>
    <!-- Mom Face -->
    <circle cx="-8" cy="2" r="3.5" fill="#212529"/>
    <circle cx="-9" cy="1" r="1.2" fill="#ffffff"/>
    <circle cx="6" cy="2" r="3.5" fill="#212529"/>
    <circle cx="5" cy="1" r="1.2" fill="#ffffff"/>
    <ellipse cx="-14" cy="9" rx="4" ry="2.5" fill="#ffc9c9" opacity="0.9"/>
    <ellipse cx="12" cy="9" rx="4" ry="2.5" fill="#ffc9c9" opacity="0.9"/>
    <path d="M -3 9 Q -1 14 1 9" stroke="#212529" stroke-width="2" fill="none"/>
  </g>
</svg>
